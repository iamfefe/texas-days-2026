name: Publish travel journal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble the travel journal
        run: |
          mkdir -p _site
          cp index.html data.js app.js memories.js style.css memories.css learning.css .nojekyll _site/
          cat travel-media.zip.part-* > /tmp/travel-media.zip
          unzip -q /tmp/travel-media.zip -d _site
          test -f _site/assets/tesla-ride-1.mp4
          test -f _site/assets/gis-professor.jpg
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
